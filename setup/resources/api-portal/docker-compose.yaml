# API Portal + Platform API - standalone release compose file. See README.md
# for usage. Each service's `profiles:` list names only itself — never a sibling
# pack's profile — so every profile can be enabled independently; combinations
# come from COMPOSE_PROFILES/--profile listing multiple names, not from one service
# pulling in another's profile.

services:
  # platform-api removed for this test run — the portal is being tested in
  # idp mode against an already-running, host-side WSO2 IS instead.

  api-portal:
    image: ghcr.io/lasanthas/api-portal:1.0.0
    container_name: api-portal
    restart: unless-stopped
    profiles: ["api-portal"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: api-platform.env
        required: true
        format: raw
    environment:
      APIP_AP_SERVER_PORT: ${APIP_AP_SERVER_PORT:-9543}
      # host.docker.internal's WSO2 IS uses a self-signed cert for this test run.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # Debug level so passportConfig.js's decoded-ID-token-claims log line is visible.
      APIP_AP_LOGGING_LEVEL: "debug"
    volumes:
      - ./configs/config.toml:/app/configs/config.toml:ro
      - api-portal-data:/app/data
      # Role-to-scope grant table (auth.authorization.role_to_scope_mapping). Mounted
      # OVER the copy baked into the image — config.toml names it by the one relative
      # path that resolves both here (WORKDIR /app) and for `npm run start:local` — so
      # editing this file on the host changes what a role grants after a restart, with
      # no rebuild and no env-var indirection.
      - ./resources/api-portal/role-to-scope-mapping.yaml:/app/resources/role-to-scope-mapping.yaml:ro
      # Design-mode sample content (APIs, MCP servers, applications, subscription
      # plans), read from disk when [api_portal.design_mode] is enabled. Edit these
      # files on the host and restart to preview your own content — no image rebuild
      # (design mode isn't baked into the image). Unused when design mode is off. The
      # standalone dist rewrites the host path to ./resources/samples (see Makefile).
      - ./resources/samples:/app/samples:ro
      - ./resources/certificates:/etc/api-portal/tls:ro
      - ./resources/keys/jwt_public.pem:/etc/api-portal/keys/jwt_public.pem:ro
      - ./resources/keys/api-portal-encryption.key:/etc/api-portal/keys/encryption.key:ro
      - ./resources/keys/api-portal-session-secret:/etc/api-portal/keys/session-secret:ro
    ports:
      - "${APIP_AP_SERVER_PORT:-9543}:${APIP_AP_SERVER_PORT:-9543}"
    networks:
      - api-portal-network

volumes:
  api-portal-data:
    driver: local

networks:
  api-portal-network:
    driver: bridge
