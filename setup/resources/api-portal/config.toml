# =============================================================================
# UNIFIED API PLATFORM CONFIGURATION
# =============================================================================
# One file, multiple components. Each service reads ONLY its own root table
# (e.g. [api_portal], [platform_api]) and ignores the other sections and
# their tokens. GENERATED by `make dist` from the per-component source configs.


# #############################################################################
# #  API PORTAL
# #############################################################################

[api_portal.server]
port = '{{ env "APIP_AP_SERVER_PORT" "9543" }}'
base_url = "https://localhost:9543"

[api_portal.server.https]
enabled   = '{{ env "APIP_AP_SERVER_HTTPS_ENABLED" "true" }}'
cert_file = "/etc/api-portal/tls/cert.pem"
key_file  = "/etc/api-portal/tls/key.pem"

[api_portal.logging]
level        = '{{ env "APIP_AP_LOGGING_LEVEL" "info" }}'
format       = "text"
console_only = true

[api_portal.database]
driver = '{{ env "APIP_AP_DATABASE_DRIVER" "sqlite" }}'
path = '{{ env "APIP_AP_DATABASE_PATH" "./data/api-portal.db" }}'

[api_portal.security]
encryption_key = '{{ file "/etc/api-portal/keys/encryption.key" }}'
session_secret = '{{ file "/etc/api-portal/keys/session-secret" }}'

# Points at the ROOT-org "API Portal" application in the host's WSO2 IS.
#
# Two different hostnames on purpose: authorization_url is a redirect target
# the BROWSER follows directly (the browser runs on the host, outside Docker's
# network, so it can't resolve host.docker.internal — "localhost" is the one
# it can reach IS through). token_url and jwks_url are called by the portal
# CONTAINER itself (server-to-server: exchanging the auth code, and verifying
# bearer tokens), which is exactly what host.docker.internal is for.

# client_id/client_secret come from scripts/setup_idp.sh — it prints this whole block.
[api_portal.auth]
mode = "idp"

[api_portal.auth.idp]
client_id = "<ROOT_APP_CLIENT_ID>"
client_secret = "<ROOT_APP_CLIENT_SECRET>"
authorization_url = "https://is.wso2.com:9444/oauth2/authorize"
token_url = "https://is.wso2.com:9444/oauth2/token"
callback_url = "https://api-portal.wso2.com:9543/api-portal/default/callback"
jwks_url = "https://is.wso2.com:9444/oauth2/jwks"
logout_url = "https://is.wso2.com:9444/oidc/logout"
logout_redirect_uri = "https://api-portal.wso2.com:9543/api-portal/logout"

[api_portal.auth.authorization]
enabled = true
mode    = "role"
role_to_scope_mapping = "./resources/role-to-scope-mapping.yaml"
page_role_validation = true

[api_portal.auth.authorization.portal_roles]
admin      = "dp_admin"
subscriber = "dp_subscriber"

[api_portal.organization]
handle       = '{{ env "APIP_AP_ORGANIZATION_HANDLE" "default" }}'
display_name = '{{ env "APIP_AP_ORGANIZATION_DISPLAY_NAME" "Default" }}'
portal_id    = '{{ env "APIP_AP_ORGANIZATION_PORTAL_ID" "portal_id" }}'

[api_portal.webhooks.delivery]
dispatch_all_organizations = true


# #############################################################################
# #  PLATFORM API
# #############################################################################

[platform_api]

[platform_api.logging]
level = '{{ env "APIP_CP_LOGGING_LEVEL" "info" }}'

[platform_api.security]
encryption_key = '{{ file "/etc/platform-api/keys/encryption.key" }}'

[platform_api.database]
driver = "sqlite3"
path   = "./data/api_platform.db"

[platform_api.auth]
mode = "file"

[platform_api.auth.authorization]
enabled = true
mode    = "scope"
role_to_scope_mapping = "/etc/platform-api/role-to-scope-mapping.yaml"

[platform_api.auth.jwt]
issuer            = "platform-api"
public_key_file   = "/etc/platform-api/keys/jwt_public.pem"
private_key_file  = "/etc/platform-api/keys/jwt_private.pem"

[platform_api.auth.file.organization]
id           = "default"
display_name = "Default"
region       = "us"

[[platform_api.auth.file.users]]
username      = '{{ env "APIP_CP_ADMIN_USERNAME" }}'
password_hash = '{{ env "APIP_CP_ADMIN_PASSWORD_HASH" }}'
roles         = ["ap_admin"]
