# Fluent Bit — container logs -> OpenSearch.
#
# THREE FIXES vs the config the gateway distribution ships. The shipped one
# produced 6.6 MILLION documents and 459 MB in about five minutes on this
# machine, and would have filled the disk:
#
#  1. trace_output / trace_error REMOVED (they were On). With them on, Fluent
#     Bit prints every _bulk request AND response to its own stdout. That
#     stdout is a container log under /var/lib/docker/containers, which the
#     tail input below is reading — so every shipped record produced new log
#     lines to ship. A self-amplifying feedback loop, not merely verbose.
#
#  2. Exclude_Path added for Fluent Bit's own container log. Belt and braces
#     for (1): even at normal verbosity, tailing your own shipper's log means
#     any warning it emits about a record becomes another record.
#
#  3. Buffer_Size raised on the OpenSearch output. The shipped 2 MB cap caused
#     "cannot increase buffer: current=2000000 requested=2032768" followed by
#     "failed to flush chunk ... retry in 31 seconds" — responses larger than
#     the cap could not be read, so healthy batches were retried forever.
#
# Scope note: this tails EVERY container on the host, not just the gateway's.
# That is the distribution's intent (one node-level collector), but on a
# developer machine running unrelated containers it means their logs land in
# OpenSearch too. Narrow `Path` if you want only the gateway stack.

[SERVICE]
    Daemon Off
    Flush 5
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    # Cap the filesystem/memory the pipeline may hold, so a slow OpenSearch
    # cannot grow Fluent Bit's buffers without bound.
    storage.metrics On

[INPUT]
    Name tail
    Tag docker.*
    Path /var/lib/docker/containers/*/*.log
    # Never tail our own log — see fix (2) above.
    Exclude_Path /var/lib/docker/containers/*/*-json.log.*, /var/lib/fluent-bit/*
    Path_Key _container_log_path
    Parser docker
    Refresh_Interval 5
    Mem_Buf_Limit 50MB
    Skip_Long_Lines On
    Docker_Mode On
    Buffer_Max_Size 10MB
    # Start at the end of existing files. Without this a restart re-ships every
    # historical line in every container log on the host.
    Read_from_Head Off

[FILTER]
    Name parser
    Match docker.*
    Key_Name log
    Parser json_parser
    Reserve_Data On

[FILTER]
    Name record_modifier
    Match docker.*
    Record hostname ${HOSTNAME}

[FILTER]
    Name lua
    Match docker.*
    script /fluent-bit/scripts/add_component.lua
    call add_component_name

# Drop Fluent Bit's own records after the Lua filter has resolved the container
# name — the definitive guard against the feedback loop, independent of paths.
[FILTER]
    Name grep
    Match docker.*
    Exclude component fluent-bit

[OUTPUT]
    Name es
    Match docker.*
    Host opensearch
    Port 9200
    Logstash_Format On
    Logstash_Prefix gateway-logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name On
    # Raised from 2MB — see fix (3) above.
    Buffer_Size 20MB
    Retry_Limit 3
    # trace_output / trace_error deliberately NOT set. See fix (1) above.
